[package]
name = "pulsar-app"
version = "0.2.0"
description = "Pulsar — an autonomous AI agent desktop client"
authors = ["you"]
edition = "2021"
default-run = "pulsar-app"

[features]
# 内嵌 server 托管前端静态资源：rust-embed 编译期嵌入 build/（构建前需先 `pnpm build`）。
embed-static = []

# 服务器版（headless）固定启用静态托管：单端口全功能（RPC/SSE/WS + 前端页面）。
[[bin]]
name = "pulsar-server"
path = "src/bin/pulsar-server.rs"
required-features = ["embed-static"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pulsar_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "net", "io-util"] }
ratatui = "0.30"
crossterm = "0.28"
ratatui-textarea = "0.9"
async-trait = "0.1"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "chrono"] }
parking_lot = "0.12"
rust-embed = "8"
rmcp = { version = "3", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
http = "1"
# 内嵌网络服务（远程模式）：统一 RPC 端点 + SSE 状态推送 + WebSocket 公共服务（/ws）。
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
futures-util = "0.3"
mlua = { version = "0.12.0", features = ["vendored", "lua54"] }
# 文件管理（core/fs.rs 与 core/workspace.rs）：glob/grep 语义与递归遍历，纯 Rust 无 C 依赖。
regex = "1"
globset = "0.4"
walkdir = "2"
# 终端面板：跨平台 PTY（Unix pty / Windows ConPTY），对标 VS Code 集成终端。
portable-pty = "0.9"
# WS 帧内二进制载荷（终端输出字节流）base64 编码。
base64 = "0.22"

[dev-dependencies]
# 仅测试用：本地 mock MCP server（stdio 走 in-memory duplex；http 走 axum 暴露的 streamable-http server）。
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1.53.1", features = ["io-util"] }
# 仅测试用：net 模块冒烟（tower::ServiceExt::oneshot 直呼 router）。
tower = { version = "0.5", features = ["util"] }
# 仅测试用：/ws 端到端用例的 WebSocket 客户端（握手 + 帧收发）。
tokio-tungstenite = "0.24"

