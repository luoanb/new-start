<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent App</title>
    %sveltekit.head%
    <style>
      html,
      body {
        height: 100%;
      }

      :root,
      [data-theme="light"] {
        /* ── Colors (cool palette) ── */
        --color-bg:           oklch(0.99 0.002 265);
        --color-surface:      oklch(0.965 0.004 265);
        --color-elevated:     oklch(0.94 0.005 265);
        --color-text:         oklch(0.12 0.008 265);
        --color-text-muted:   oklch(0.47 0.012 265);
        --color-border:       oklch(0.89 0.005 265);
        --color-primary:      oklch(0.52 0.24 260);
        --color-primary-dim:  oklch(0.42 0.2 260);
        --color-on-primary:   oklch(0.99 0.002 265);
        --color-hover:        oklch(0.92 0.004 265);
        --color-error:        oklch(0.5 0.22 25);
        --color-error-bg:     oklch(0.92 0.06 25);
        --color-success:      oklch(0.52 0.18 145);
        --color-warning:      oklch(0.62 0.2 80);

        /* ── Neuron system_type palette ── */
        --color-system-default:     oklch(0.55 0.02 265);
        --color-system-core:        oklch(0.52 0.24 260);
        --color-system-user:        oklch(0.62 0.2 200);
        --color-system-environment: oklch(0.55 0.16 160);
        --color-system-assistant:   oklch(0.6 0.18 145);
        --color-system-tool:        oklch(0.7 0.17 80);
        --color-system-knowledge:   oklch(0.6 0.2 300);
        --color-system-topic:       oklch(0.64 0.21 350);
        --color-system-memory:      oklch(0.58 0.16 30);
        --color-system-note:        oklch(0.5 0.02 265);

        /* ── Typography scale ── */
        --fs-xs:   11px;
        --fs-sm:   13px;
        --fs-base: 14px;
        --fs-lg:   16px;
        --fs-xl:   20px;

        /* ── Spacing ── */
        --space-1:  4px;
        --space-2:  8px;
        --space-3:  12px;
        --space-4:  16px;
        --space-5:  20px;
        --space-6:  24px;
        --space-8:  32px;
        --space-10: 40px;
        --space-12: 48px;
        --space-16: 64px;

        /* ── Border & Radius ── */
        --radius-sm:   6px;
        --radius-md:   8px;
        --radius-lg:   12px;
        --radius-full: 9999px;
        --border-width: 1px;

        /* ── Motion ── */
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --duration-fast:   150ms;
        --duration-normal: 250ms;

        color-scheme: light;
      }

      [data-theme="dark"] {
        --color-bg:           oklch(0.105 0.005 265);
        --color-surface:      oklch(0.145 0.006 265);
        --color-elevated:     oklch(0.19 0.007 265);
        --color-text:         oklch(0.95 0.004 265);
        --color-text-muted:   oklch(0.58 0.01 265);
        --color-border:       oklch(0.23 0.006 265);
        --color-primary:      oklch(0.68 0.24 258);
        --color-primary-dim:  oklch(0.58 0.2 258);
        --color-on-primary:   oklch(0.11 0.005 265);
        --color-hover:        oklch(0.23 0.006 265);
        --color-error:        oklch(0.55 0.22 25);
        --color-error-bg:     oklch(0.18 0.06 25);
        --color-success:      oklch(0.55 0.18 145);
        --color-warning:      oklch(0.65 0.2 80);

        /* ── Neuron system_type palette ── */
        --color-system-default:     oklch(0.7 0.02 265);
        --color-system-core:        oklch(0.72 0.2 260);
        --color-system-user:        oklch(0.74 0.16 200);
        --color-system-environment: oklch(0.68 0.14 160);
        --color-system-assistant:   oklch(0.7 0.16 145);
        --color-system-tool:        oklch(0.78 0.15 80);
        --color-system-knowledge:   oklch(0.72 0.18 300);
        --color-system-topic:        oklch(0.74 0.19 350);
        --color-system-memory:      oklch(0.7 0.14 30);
        --color-system-note:        oklch(0.68 0.02 265);

        color-scheme: dark;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]):not([data-theme="dark"]),
        [data-theme="system"] {
          --color-bg:           oklch(0.105 0.005 265);
          --color-surface:      oklch(0.145 0.006 265);
          --color-elevated:     oklch(0.19 0.007 265);
          --color-text:         oklch(0.95 0.004 265);
          --color-text-muted:   oklch(0.58 0.01 265);
          --color-border:       oklch(0.23 0.006 265);
          --color-primary:      oklch(0.68 0.24 258);
          --color-primary-dim:  oklch(0.58 0.2 258);
          --color-on-primary:   oklch(0.11 0.005 265);
          --color-hover:        oklch(0.23 0.006 265);
          --color-error:        oklch(0.55 0.22 25);
          --color-error-bg:     oklch(0.18 0.06 25);
          --color-success:      oklch(0.55 0.18 145);
          --color-warning:      oklch(0.65 0.2 80);

          /* ── Neuron system_type palette ── */
          --color-system-default:     oklch(0.7 0.02 265);
          --color-system-core:        oklch(0.72 0.2 260);
          --color-system-user:        oklch(0.74 0.16 200);
          --color-system-environment: oklch(0.68 0.14 160);
          --color-system-assistant:   oklch(0.7 0.16 145);
          --color-system-tool:        oklch(0.78 0.15 80);
          --color-system-knowledge:   oklch(0.72 0.18 300);
          --color-system-topic:        oklch(0.74 0.19 350);
          --color-system-memory:      oklch(0.7 0.14 30);
          --color-system-note:        oklch(0.68 0.02 265);

          color-scheme: dark;
        }
      }

      /* ── Native <select> / <option> 主题适配（下拉列表由原生渲染，需 color-scheme + 显式配色）── */
      select {
        background-color: var(--color-surface);
        color: var(--color-text);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
      }
      select option {
        background-color: var(--color-elevated);
        color: var(--color-text);
      }
    </style>
  </head>
  <body data-sveltekit-preload-data="hover">
    <!--
      Avoid display:contents around SvelteKit body: on WebKitGTK + Wayland + fcitx5
      it can break caret client rects, so IME candidate windows offset (~400px) or
      disappear near the bottom of the window. Block wrapper preserves layout via 100vh app shell.
    -->
    <div style="height: 100%;">%sveltekit.body%</div>
  </body>
</html>
